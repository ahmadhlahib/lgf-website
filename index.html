<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lebanese Gymnastics Federation - draft website by Ahmad El Lahib">
<meta name="robots" content="noindex">
<meta charset="utf-8">
<title>Lebanese Gymnastics Federation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Readex+Pro:wght@300;400;500;700&display=swap">
<style>
/* Layout: sticky federation header, routed views (#home #federation #clubs #competitions #athletes), red hero bands, white content. Deliberately single light look (official site). */
:root{
  --bg:#ffffff; --surface:#f3f5f7; --ink:#11161d; --muted:#596473; --line:#e2e6eb;
  --red:#d8232a; --red-dark:#a9161c; --red-soft:#fdeced; --cedar:#0b8a4c; --cedar-soft:#e4f4eb; --gold:#c9962b;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
[dir="rtl"] body,[dir="rtl"]{font-family:var(--body)}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3,[dir="rtl"] h4{font-family:var(--body);font-weight:700;line-height:1.35}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}

/* draft strip */
.draft{background:var(--ink);color:#fff;font-size:.78rem;text-align:center;padding:6px 16px}
.draft b{color:#ffb4b7;font-weight:500}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:#fff}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
.mark{width:44px;height:44px;flex:none;border-radius:50%;background:var(--red);display:grid;place-items:center;transition:transform .7s cubic-bezier(.5,-.4,.4,1.4)}
.brand:hover .mark{transform:rotate(360deg)}
.mark svg{width:26px;height:26px}
.brand-t{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand-t b{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-t small{font-size:.72rem;color:var(--muted)}
nav.main{display:flex;gap:4px;margin-inline-start:auto;overflow-x:auto;scrollbar-width:none}
nav.main a{text-decoration:none;padding:8px 12px;border-radius:999px;font-size:.88rem;white-space:nowrap;color:var(--muted)}
nav.main a:hover{color:var(--ink);background:var(--surface)}
nav.main a[aria-current="page"]{background:var(--ink);color:#fff}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.langs button{all:unset;cursor:pointer;padding:6px 11px;font-size:.78rem}
.langs button[aria-pressed="true"]{background:var(--red);color:#fff}
.langs button:focus-visible{outline:3px solid var(--ink);outline-offset:-3px}
@media (max-width:900px){
  .bar{flex-wrap:wrap;row-gap:8px}
  nav.main{order:3;width:100%;margin:0}
  .langs{margin-inline-start:auto}
}

/* generic */
section{padding-block:72px}
.eyebrow{display:inline-block;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:500;margin-bottom:12px}
[dir="rtl"] .eyebrow{letter-spacing:0;font-size:.85rem}
.h2{font-size:clamp(1.6rem,3.4vw,2.5rem)}
.lede{color:var(--muted);max-width:62ch;margin-top:14px;font-size:1.05rem}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:34px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;font-weight:500;text-decoration:none;border:2px solid transparent;cursor:pointer;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn-red{background:var(--red);color:#fff}
.btn-white{background:#fff;color:var(--ink)}
.btn-line{border-color:currentColor;background:transparent;color:inherit}
.arrow{display:inline-block;transition:transform .2s}
[dir="rtl"] .arrow{transform:scaleX(-1)}
.sample{display:inline-block;font-size:.66rem;padding:2px 7px;border-radius:3px;background:var(--surface);color:var(--muted);border:1px dashed #c3cad3;vertical-align:middle;margin-inline-start:6px;font-family:var(--body);font-weight:400;letter-spacing:0;text-transform:none}

/* hero */
.hero{background:var(--red);color:#fff;position:relative;overflow:hidden;padding-block:72px 84px}
.hero-grid{display:grid;grid-template-columns:1.25fr .9fr;gap:40px;align-items:center;position:relative;z-index:1}
.hero-grid > *{min-width:0}
.hero h1{font-size:clamp(2.4rem,6.6vw,5.2rem);font-weight:900;letter-spacing:-.02em}
[dir="rtl"] .hero h1{letter-spacing:0;font-size:clamp(2.4rem,6vw,4.6rem)}
.hero h1 em{font-style:normal;display:block;color:var(--ink)}
.hero p{margin-top:20px;font-size:1.12rem;max-width:48ch;opacity:.95}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.3}
.count{background:#fff;color:var(--ink);border-radius:14px;padding:24px;box-shadow:14px 14px 0 var(--ink)}
[dir="rtl"] .count{box-shadow:-14px 14px 0 var(--ink)}
.count small{color:var(--red);font-weight:500;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.count h3{font-size:1.25rem;margin-top:6px}
.count .where{color:var(--muted);font-size:.9rem;margin-top:4px}
.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px;text-align:center}
.clock div{background:var(--surface);border-radius:8px;padding:10px 4px}
.clock b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.clock span{font-size:.7rem;color:var(--muted)}

/* ticker */
.ticker{background:var(--ink);color:#fff;overflow:hidden;white-space:nowrap;font-size:.88rem}
.ticker-in{display:inline-flex;gap:48px;padding:12px 0;animation:tick 40s linear infinite}
[dir="rtl"] .ticker-in{animation-name:tick-rtl}
.ticker-in span::before{content:"●";color:var(--red);margin-inline-end:10px}
@keyframes tick{to{transform:translateX(-50%)}}
@keyframes tick-rtl{to{transform:translateX(50%)}}

/* disciplines */
.disc{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.disc article{border:1px solid var(--line);border-radius:14px;padding:20px 18px;cursor:default;transition:transform .35s cubic-bezier(.3,1.6,.5,1),border-color .2s;min-width:0}
.disc article:hover{transform:translateY(-6px) rotate(-1.5deg);border-color:var(--red)}
.disc svg{width:46px;height:46px;color:var(--red)}
.disc h3{font-size:.95rem;margin-top:14px}
.disc p{font-size:.82rem;color:var(--muted);margin-top:4px}

/* stats */
.stats{background:var(--surface)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:28px}
.stat b{font-family:var(--display);font-size:clamp(2.4rem,5vw,3.6rem);color:var(--red);display:block;line-height:1;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:10px;color:var(--muted);font-size:.95rem}

/* president */
.pres{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:56px;align-items:center}
.pres img{width:100%;height:auto;aspect-ratio:2/3;object-fit:cover;border-radius:12px;box-shadow:16px 16px 0 var(--red)}
[dir="rtl"] .pres img{box-shadow:-16px 16px 0 var(--red)}
.pres blockquote{margin:14px 0 0;font-size:clamp(1.15rem,2.4vw,1.6rem);line-height:1.5}
.pres blockquote::before{content:"“";display:block;font-family:var(--display);font-size:4rem;line-height:.6;color:var(--red);margin-bottom:10px}
.sign{margin-top:22px}
.sign b{display:block;font-size:1.1rem}
.sign span{color:var(--muted);font-size:.92rem}
@media (max-width:760px){.pres{grid-template-columns:1fr;gap:32px}.pres img{max-width:240px}}

/* quiz */
.quiz{background:var(--ink);color:#fff;border-radius:20px;padding:40px;display:grid;grid-template-columns:1fr 1.2fr;gap:40px;align-items:center}
.quiz > *{min-width:0}
.quiz .eyebrow{color:#ff8a8f}
.quiz h2{color:#fff}
.q-card{background:#1d242d;border-radius:14px;padding:26px;min-height:240px}
.q-step{font-size:.78rem;color:#9aa6b4}
.q-card h3{font-size:1.15rem;margin:8px 0 18px;color:#fff}
.q-opts{display:grid;gap:10px}
.q-opts button{all:unset;cursor:pointer;background:#2a333e;padding:12px 16px;border-radius:10px;transition:background .2s,transform .2s}
.q-opts button:hover{background:var(--red);transform:translateX(4px)}
[dir="rtl"] .q-opts button:hover{transform:translateX(-4px)}
.q-opts button:focus-visible{outline:3px solid #fff}
.q-res b{font-family:var(--display);font-size:1.8rem;color:#ff8a8f;display:block;margin:8px 0}
[dir="rtl"] .q-res b{font-family:var(--body)}
.q-res p{color:#c9d1da}
.q-res .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
@media (max-width:820px){.quiz{grid-template-columns:1fr;padding:26px}}

/* news cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.card{border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;background:#fff}
.card .img{aspect-ratio:16/10;position:relative;overflow:hidden}
.card .img i{position:absolute;inset:0}
.card .img span{position:absolute;bottom:12px;inset-inline-start:12px;background:#fff;font-size:.72rem;padding:4px 10px;border-radius:999px;font-weight:500}
.card .body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.card time{font-size:.78rem;color:var(--muted)}
.card h3{font-size:1.02rem}
.card p{color:var(--muted);font-size:.9rem}

/* partners */
.partners{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.partners span{border:1px solid var(--line);border-radius:10px;padding:14px 20px;font-weight:500;color:var(--muted);font-size:.9rem}

/* page hero */
.phero{background:var(--red);color:#fff;padding-block:56px 60px;position:relative;overflow:hidden}
.phero h1{font-size:clamp(2rem,5vw,3.6rem);font-weight:900}
.phero p{margin-top:14px;max-width:60ch;opacity:.95;font-size:1.05rem}
.phero::after{content:"";position:absolute;width:420px;height:420px;border:2px dashed rgba(255,255,255,.35);border-radius:50%;inset-inline-end:-120px;top:-160px}

/* members */
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px}
.member{text-align:center;min-width:0}
.member .ph{aspect-ratio:1;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-size:1.6rem;color:#b6bec8;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);max-width:170px;margin:0 auto}
.member .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.member.lead .ph{box-shadow:0 0 0 3px var(--red)}
.member b{display:block;margin-top:14px}
.member span{font-size:.85rem;color:var(--muted)}

/* timeline */
.tl{position:relative;display:grid;gap:26px;padding-inline-start:36px}
.tl::before{content:"";position:absolute;inset-block:6px;inset-inline-start:11px;width:3px;background:linear-gradient(var(--red),var(--cedar))}
.tl article{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;transition:transform .5s cubic-bezier(.2,.9,.3,1.2)}
.tl article::before{content:"";position:absolute;inset-inline-start:-32px;top:22px;width:17px;height:17px;border-radius:50%;background:#fff;border:4px solid var(--red)}
.tl article.gap{border-style:dashed;background:var(--surface)}
.tl article.gap::before{border-color:#b6bec8}
.tl .yr{font-family:var(--display);font-size:1.5rem;color:var(--red)}
.tl h3{font-size:1.02rem;margin-top:6px}
.tl p{color:var(--muted);font-size:.92rem;margin-top:6px}
.tl article.pre{transform:translateX(-14px)}
[dir="rtl"] .tl article.pre{transform:translateX(14px)}
.tl article.in{transform:none}

/* clubs */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:26px}
.filters input{flex:1 1 220px;padding:12px 16px;border:1px solid var(--line);border-radius:999px;font:inherit;min-width:0}
.chip{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip:focus-visible{outline:3px solid var(--red)}
.club-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:28px;align-items:start}
@media (max-width:900px){.club-layout{grid-template-columns:1fr}}
.club-list{display:grid;gap:14px}
.club{display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;transition:border-color .2s}
.club:hover,.club.hl{border-color:var(--red)}
.club .lg{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:.85rem}
.club > div{min-width:0}
.club h3{font-size:.98rem}
.club p{font-size:.82rem;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tags i{font-style:normal;font-size:.7rem;padding:2px 8px;border-radius:999px;background:var(--cedar-soft);color:var(--cedar)}
.club .ag{font-size:.75rem;color:var(--muted);text-align:end;white-space:nowrap}
.club .ag b{display:block;font-size:1.1rem;color:var(--ink);font-family:var(--display)}
.club .tel{font-variant-numeric:tabular-nums;margin-top:2px}
[dir="rtl"] .club .tel{text-align:right}
.club .cta-c{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.cbtn{text-decoration:none;font-size:.8rem;font-weight:500;padding:8px 14px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.cbtn:hover{border-color:var(--red);color:var(--red)}
.cbtn.wa{background:var(--cedar);border-color:var(--cedar);color:#fff}
.cbtn.wa:hover{background:#086c3b;color:#fff}
.club-layout.solo{grid-template-columns:1fr}
.club-layout.solo .club-list{grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
@media (max-width:520px){.club{grid-template-columns:56px 1fr}.club .cta-c{grid-column:1/-1;justify-content:stretch}.cbtn{flex:1;text-align:center}}
.map{background:var(--surface);border-radius:16px;padding:18px;position:sticky;top:110px}
.map svg{width:100%;height:auto;display:block}
.map .reg{fill:#dfe4ea;stroke:#fff;stroke-width:3;transition:fill .2s;cursor:pointer}
.map .reg:hover{fill:#f6c4c6}
.map .reg.on{fill:var(--red)}
.map text{font-size:12px;fill:var(--ink);pointer-events:none;font-family:var(--body)}
.map .dot{fill:var(--ink)}
.map p{font-size:.8rem;color:var(--muted);margin-top:10px}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

/* competitions */
.events{display:grid;gap:14px}
.ev{display:grid;grid-template-columns:86px 1fr auto;gap:20px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:16px 20px;min-width:0}
.ev > div{min-width:0}
.ev .dt{text-align:center;background:var(--red-soft);border-radius:10px;padding:10px 4px;color:var(--red)}
.ev .dt b{display:block;font-family:var(--display);font-size:1.6rem;line-height:1}
.ev .dt span{font-size:.75rem;text-transform:uppercase}
.ev h3{font-size:1rem}
.ev p{font-size:.85rem;color:var(--muted)}
.lvl{font-size:.72rem;padding:4px 10px;border-radius:999px;white-space:nowrap}
.lvl.nat{background:var(--cedar-soft);color:var(--cedar)}
.lvl.int{background:var(--ink);color:#fff}
@media (max-width:600px){.ev{grid-template-columns:70px 1fr}.ev .lvl{grid-column:2;justify-self:start}}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:.92rem}
th,td{padding:12px 16px;text-align:start;border-bottom:1px solid var(--line)}
th{background:var(--surface);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
td.num{font-variant-numeric:tabular-nums;text-align:end}
th.num{text-align:end}
tr:last-child td{border-bottom:0}
tr.lb td{background:#fff8f8}
.rk{font-family:var(--display);font-weight:700}
.medal{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline-end:6px;vertical-align:-1px}

/* athletes */
.ath{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.acard{border-radius:16px;overflow:hidden;position:relative;color:#fff;min-height:300px;display:flex;flex-direction:column;justify-content:end;padding:20px;transition:transform .4s cubic-bezier(.3,1.5,.5,1)}
.acard:hover{transform:translateY(-8px) rotate(1deg)}
.acard .big{position:absolute;top:10px;inset-inline-end:14px;font-family:var(--display);font-size:5rem;opacity:.18;line-height:1}
.acard small{opacity:.85;font-size:.8rem}
.acard h3{font-size:1.25rem;margin-top:4px}
.acard p{font-size:.85rem;opacity:.9;margin-top:8px}
.wall{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:56px}
.wall div{border-radius:14px;padding:22px;background:var(--surface);min-width:0}
.wall b{font-family:var(--display);font-size:2.6rem;display:block;line-height:1;font-variant-numeric:tabular-nums}
.wall span{font-size:.88rem;color:var(--muted);display:block;margin-top:8px}

/* 404 */
.oops{text-align:center;padding-block:110px}
.oops .flip{display:inline-block;font-size:5rem;font-family:var(--display);color:var(--red);animation:flip 2.4s cubic-bezier(.6,-.3,.4,1.3) infinite}
@keyframes flip{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(360deg)}}

/* footer */
footer{background:var(--ink);color:#c9d1da;padding-block:56px 32px;margin-top:40px}
.f-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:36px}
.f-grid > *{min-width:0}
footer h4{color:#fff;font-size:.9rem;margin-bottom:14px}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:.9rem}
footer a{text-decoration:none}
footer a:hover{color:#fff}
.credit{margin-top:44px;padding-top:22px;border-top:1px solid #2a333e;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:.84rem}
.credit b{color:#fff}
.credit .by{display:inline-flex;align-items:center;gap:8px}
.credit .by i{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.6);opacity:.5}}
@media (max-width:760px){.f-grid{grid-template-columns:1fr}.hero-grid{grid-template-columns:1fr}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.tl article.pre{transform:none}}
</style>
</head>
<body>

<div class="draft" data-t="draft" data-html="1"></div>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#home">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="#fff"><path d="M16 3l3.2 6.4-2 .2 4.6 6-2.4.2 5.6 7.2H18v6h-4v-6H7l5.6-7.2-2.4-.2 4.6-6-2-.2z"/></svg></span>
      <span class="brand-t"><b data-t="fed"></b><small data-t="fedSub"></small></span>
    </a>
    <nav class="main" aria-label="Main">
      <a href="#home" data-t="nHome"></a>
      <a href="#federation" data-t="nFed"></a>
      <a href="#clubs" data-t="nClubs"></a>
      <a href="#competitions" data-t="nComp"></a>
      <a href="#athletes" data-t="nAth"></a>
    </nav>
    <div class="langs" role="group" aria-label="Language">
      <button id="lg-ar" data-l="ar">ع</button><button id="lg-fr" data-l="fr">FR</button><button id="lg-en" data-l="en">EN</button>
    </div>
  </div>
</header>

/* ---------- MOTION ---------- */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function startRibbon(){
 cancelAnimationFrame(raf);const cv=document.getElementById('rib');if(!cv)return;const cx=cv.getContext('2d');
 const fit=()=>{const r=cv.getBoundingClientRect();cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio};fit();
 const draw=tm=>{const w=cv.width,h=cv.height,dp=devicePixelRatio;cx.clearRect(0,0,w,h);
  [['#ffffff',3],['#11161d',8],['#0b8a4c',5]].forEach((s,k)=>{cx.beginPath();cx.strokeStyle=s[0];cx.lineWidth=s[1]*dp;cx.lineCap='round';
   for(let i=0;i<=160;i++){const p=i/160,x=w*p,y=h*.62+Math.sin(p*7+tm/1100+k*1.1)*h*.18*Math.sin(p*Math.PI)+(k-1)*18*dp;i?cx.lineTo(x,y):cx.moveTo(x,y)}cx.stroke()});
  if(!reduce&&document.getElementById('rib')===cv)raf=requestAnimationFrame(draw)};
 draw(0);
}
function countUp(){
 if(reduce)return;
 document.querySelectorAll('[data-count]').forEach(el=>{const end=+el.dataset.count,suf=el.dataset.suf||'',from=end>1000?end-60:0,t0=performance.now();
  const step=n=>{const p=Math.min(1,(n-t0)/1400),e=1-Math.pow(1-p,3);el.textContent=Math.round(from+(end-from)*e)+suf;if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)});
}
function reveal(){
 const items=document.querySelectorAll('.tl article.pre');if(!items.length)return;
 if(reduce||!('IntersectionObserver' in window)){items.forEach(i=>i.classList.add('in'));return}
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.3});
 items.forEach(i=>io.observe(i));
}
let clockT;
function clock(){
 clearInterval(clockT);const el=document.getElementById('clock');if(!el)return;
 const target=new Date('2026-12-13T09:00:00+02:00').getTime();
 const tickF=()=>{let s=Math.max(0,Math.floor((target-Date.now())/1000));const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);s%=60;
  el.innerHTML=[[d,t('d')],[h,t('h')],[m,t('m')],[s,t('s')]].map(v=>`<div><b>${String(v[0]).padStart(2,'0')}</b><span>${v[1]}</span></div>`).join('')};
 tickF();clockT=setInterval(tickF,1000);
}
addEventListener('resize',()=>{if(document.getElementById('rib'))startRibbon()});
